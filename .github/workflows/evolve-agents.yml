name: Evolve SOUL.md

# Runs when a post lands on master. draft-post.yml writes a post *from*
# AGENTS.md and SOUL.md; this writes a lesson *back into* SOUL.md, so who I am
# keeps evolving instead of staying a fixed brief forever. AGENTS.md (the
# operating manual) is not this job's concern.
#
# It also grows rss-radar's feed list: a source liked once (discover.mjs found
# a working feed for it) gets added to feeds.json, so it's checked routinely
# going forward rather than relied on once by accident.
#
# And it can refine the house style: src/blog.css is copied verbatim by the
# build (nothing parses or validates it — see AGENTS.md), so a change here
# gets its own guard, check-css.mjs, rather than trusting "npm run build
# passed". A failed check discards just the CSS change, not the whole run.
on:
  pull_request:
    types: [closed]
    paths:
      - 'posts/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to retrospect on (for a manual run)'
        required: true

# Only the default token, scoped to what this job needs: push a branch and
# open a pull request. It cannot touch master directly — SOUL.md is who this
# agent is, so a change to it gets the same human review a post does.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evolve-agents
  cancel-in-progress: false

jobs:
  evolve:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Find the merged post
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          echo "pr_body<<EOF" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          post_path="$(gh pr view "$PR_NUMBER" --json files --jq '[.files[].path | select(startswith("posts/") and endswith(".md"))][0] // ""')"
          if [ -z "$post_path" ]; then
            echo "No markdown file under posts/ in PR #$PR_NUMBER — nothing to retrospect on."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "path=$post_path" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.post.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.post.outputs.skip != 'true'

      - name: Install Pi
        if: steps.post.outputs.skip != 'true'
        run: npm i -g --ignore-scripts @earendil-works/pi-coding-agent

      # Same approach as draft-post.yml: Hyper isn't a provider Pi knows
      # about, so it's declared via a template whose apiKey is the
      # $HYPER_API_KEY env var, not the key itself.
      - name: Register the Hyper provider
        if: steps.post.outputs.skip != 'true'
        run: |
          mkdir -p ~/.pi/agent
          cp .github/pi/models.json ~/.pi/agent/models.json

      - name: Reflect on the post, update SOUL.md, and look for a new feed
        if: steps.post.outputs.skip != 'true'
        env:
          HYPER_API_KEY: ${{ secrets.HYPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_TOKEN }}
          PI_MODEL: ${{ vars.PI_MODEL || 'deepseek-v4.1-flash' }}
          MERGED_POST: ${{ steps.post.outputs.path }}
          PR_BODY: ${{ steps.post.outputs.pr_body }}
          # Enforced by .pi/extensions/path-guard.ts, not just the prompt: this
          # job may only write/edit these three files, full stop — no "fix
          # AGENTS.md if a convention is wrong" escape hatch anymore. If that
          # comes up, the prompt now asks it to say so in the final message
          # instead, for a human (or the interactive agent) to act on.
          PI_PATH_GUARD_ALLOW: "SOUL.md,.agents/skills/rss-radar/feeds.json,src/blog.css"
        run: |
          # Same fix as draft-post.yml, and see live-log.mjs's docstring for
          # why --print alone isn't enough: a provider HTTP error (seen live —
          # a 403 page from whatever fronts hyper.charm.land) comes back as a
          # well-formed `stopReason: "error"` event, and `pi` itself still
          # exits 0. --print just dumped the raw error page as if it were the
          # model's answer. live-log.mjs now detects that event and exits 1,
          # which this pipefail actually needs to have something to propagate
          # — without it, a failed call was indistinguishable from "learned
          # nothing this run" at the "nothing changed" branch below.
          set -o pipefail
          {
            cat .github/prompts/evolve-agents.md
            echo
            echo "## This run"
            echo
            echo "MERGED_POST: $MERGED_POST"
            echo
            echo "PR_BODY:"
            echo '```'
            echo "$PR_BODY"
            echo '```'
          } | pi --mode json \
                 --model "$PI_MODEL" \
                 --provider hyper \
                 --no-session \
                 --approve \
                | node .github/pi/live-log.mjs "$RUNNER_TEMP/agent-summary.txt"

      - name: Validate any style change
        if: steps.post.outputs.skip != 'true'
        run: |
          if [ -z "$(git status --porcelain src/blog.css)" ]; then
            exit 0
          fi
          if ! node .github/pi/check-css.mjs src/blog.css; then
            echo "Discarding the src/blog.css change — see reasons above. Any SOUL.md/feeds.json change from this run is unaffected."
            git checkout -- src/blog.css
          fi

      - name: Open a pull request if anything changed
        if: steps.post.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          MERGED_POST: ${{ steps.post.outputs.path }}
        run: |
          tracked="SOUL.md .agents/skills/rss-radar/feeds.json src/blog.css"
          if [ -z "$(git status --porcelain $tracked)" ]; then
            echo "Nothing changed — no lesson, no new feed, no style refinement this run."
            echo "--- agent summary ---"
            cat "$RUNNER_TEMP/agent-summary.txt"
            exit 0
          fi

          # Title reflects what actually changed — a run can touch any subset
          # of the three tracked paths, so build the label list rather than
          # hand-coding every combination.
          slug="$(basename "$MERGED_POST" .md)"
          labels=()
          [ -n "$(git status --porcelain SOUL.md)" ] && labels+=("SOUL.md")
          [ -n "$(git status --porcelain .agents/skills/rss-radar/feeds.json)" ] && labels+=("a feed")
          [ -n "$(git status --porcelain src/blog.css)" ] && labels+=("blog.css")
          joined="${labels[0]}"
          for l in "${labels[@]:1}"; do joined="$joined, $l"; done
          title="Evolve $joined, after $slug"

          git config user.name "quill"
          git config user.email "quill@vorticalbox.github.io"
          branch="evolve/$(date -u +%Y-%m-%d)-$RUN_ID"
          git checkout -b "$branch"
          git add $tracked
          git commit -m "$title"
          git push -u origin "$branch"

          {
            echo "Written by the retrospective agent from \`.github/prompts/evolve-agents.md\`,"
            echo "after \`$MERGED_POST\` was merged."
            echo
            echo "**Review before merging — this changes who the next run thinks it is"
            echo "and/or what it reads to find the next one.**"
            echo
            # The agent's final message, capped so a chatty run can't fill the PR.
            head -c 4000 "$RUNNER_TEMP/agent-summary.txt" 2>/dev/null || echo "_no summary captured_"
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md"

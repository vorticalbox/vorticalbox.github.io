name: Reflect and evolve

# Runs when a post lands on master. draft-post.yml writes a post *from*
# AGENTS.md and SOUL.md; this is the other half — having just learned
# whatever that post's research taught, the agent decides for itself whether
# anything about the blog (including itself) should change. That can be a
# SOUL.md lesson, a new rss-radar feed, a refinement to src/blog.css, a
# correction to an older post, or something genuinely new — a tool, a page,
# a visualization, whatever the research actually suggests. It always
# proposes this as a PR; nothing is live until a human approves or rejects
# it, same as any other change here. See AGENTS.md's "How the
# self-improvement loop is wired" for the full picture, including why this
# job is trusted with almost the whole repo and what the two exceptions are.
on:
  pull_request:
    types: [closed]
    paths:
      - 'posts/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to retrospect on (for a manual run)'
        required: true

# Only the default token, scoped to what this job needs: push a branch and
# open a pull request. It cannot touch master directly — that PR is the
# entire safety model now that scope is this broad.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evolve-agents
  cancel-in-progress: false

jobs:
  evolve:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Find the merged post
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          echo "pr_body<<EOF" >> "$GITHUB_OUTPUT"
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          post_path="$(gh pr view "$PR_NUMBER" --json files --jq '[.files[].path | select(startswith("posts/") and endswith(".md"))][0] // ""')"
          if [ -z "$post_path" ]; then
            echo "No markdown file under posts/ in PR #$PR_NUMBER — nothing to retrospect on."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "path=$post_path" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.post.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.post.outputs.skip != 'true'

      - name: Install Pi
        if: steps.post.outputs.skip != 'true'
        run: npm i -g --ignore-scripts @earendil-works/pi-coding-agent

      # Same approach as draft-post.yml: Hyper isn't a provider Pi knows
      # about, so it's declared via a template whose apiKey is the
      # $HYPER_API_KEY env var, not the key itself.
      - name: Register the Hyper provider
        if: steps.post.outputs.skip != 'true'
        run: |
          mkdir -p ~/.pi/agent
          cp .github/pi/models.json ~/.pi/agent/models.json

      - name: Reflect on the post and decide what, if anything, to change
        if: steps.post.outputs.skip != 'true'
        env:
          HYPER_API_KEY: ${{ secrets.HYPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_TOKEN }}
          PI_MODEL: ${{ vars.PI_MODEL || 'deepseek-v4.1-flash' }}
          MERGED_POST: ${{ steps.post.outputs.path }}
          PR_BODY: ${{ steps.post.outputs.pr_body }}
          # A deny-list, not an allow-list: this job can touch almost the
          # whole repo now (new posts, edited posts, new pages, scripts,
          # CSS, SOUL.md, AGENTS.md, README — whatever the research
          # suggests). The two things still off the table are the workflow
          # files and this guard itself. GitHub already neutralizes most of
          # the risk there on its own — a pull_request-triggered workflow
          # always runs from the base ref, never the PR branch, so editing
          # .github/workflows/*.yml in this PR has zero effect until a human
          # merges it, same as any other change. Keeping them explicitly
          # denied anyway is cheap insurance against a prompt-injected
          # "helpfully disable your own guard" instruction — the content
          # this job reads (article text, comments) is attacker-reachable
          # in principle, even if nothing has shown signs of that so far.
          PI_PATH_GUARD_DENY: ".github/workflows/,.pi/extensions/path-guard.ts"
        run: |
          # Same fix as draft-post.yml, and see live-log.mjs's docstring for
          # why --print alone isn't enough: a provider HTTP error (seen live —
          # a 403 page from whatever fronts hyper.charm.land) comes back as a
          # well-formed `stopReason: "error"` event, and `pi` itself still
          # exits 0. --print just dumped the raw error page as if it were the
          # model's answer. live-log.mjs now detects that event and exits 1,
          # which this pipefail actually needs to have something to propagate
          # — without it, a failed call was indistinguishable from "learned
          # nothing this run" at the "nothing changed" branch below.
          set -o pipefail
          {
            cat .github/prompts/evolve-agents.md
            echo
            echo "## This run"
            echo
            echo "MERGED_POST: $MERGED_POST"
            echo
            echo "PR_BODY:"
            echo '```'
            echo "$PR_BODY"
            echo '```'
          } | pi --mode json \
                 --model "$PI_MODEL" \
                 --provider hyper \
                 --no-session \
                 --approve \
                | node .github/pi/live-log.mjs "$RUNNER_TEMP/agent-summary.txt"

      - name: Open a pull request if anything changed
        if: steps.post.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          MERGED_POST: ${{ steps.post.outputs.path }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed this run — reflected and decided there was nothing worth doing."
            echo "--- agent summary ---"
            cat "$RUNNER_TEMP/agent-summary.txt"
            exit 0
          fi

          # The agent's final message is asked to start with exactly one
          # line, "TITLE: ...", which becomes the PR/commit title; the rest
          # becomes the PR body. A run that changed files but produced no
          # usable title still deserves a PR, not a silently dropped one, so
          # fall back to a generic title rather than failing here.
          slug="$(basename "$MERGED_POST" .md)"
          summary="$RUNNER_TEMP/agent-summary.txt"
          title="$(head -1 "$summary" 2>/dev/null | sed -n 's/^TITLE: *//p')"
          if [ -n "$title" ]; then
            body_start=2
          else
            title="Self-directed update after $slug"
            body_start=1
          fi

          # If src/blog.css changed, note what check-css.mjs finds — purely
          # informational now (see AGENTS.md): this job isn't scoped down to
          # specific files anymore, so nothing here blocks or discards
          # anything. The human reviewing the PR is the actual gate; this
          # just gives them a head start on one specific, previously-bitten
          # failure mode (build.mjs copies this file verbatim, so a broken
          # or house-style-breaking edit wouldn't show up as a build failure
          # on its own).
          css_note=""
          if [ -n "$(git status --porcelain src/blog.css 2>/dev/null)" ]; then
            if css_check_output="$(node .github/pi/check-css.mjs src/blog.css 2>&1)"; then
              css_note=$'\n\n`src/blog.css` changed — automated check: looks structurally sound and keeps the house-style identity.'
            else
              css_note=$'\n\n`src/blog.css` changed — automated check found a problem, review the diff closely:\n```\n'"$css_check_output"$'\n```'
            fi
          fi

          # Verify the build before anything else can see this. Scope is now
          # "almost anything in the repo", including scripts/build.mjs
          # itself, so this is the one gate that must never be skipped —
          # ci.yml will also build this PR independently, but a post-merge
          # job proposing a change that doesn't even build is noise nobody
          # should have to triage by hand.
          npm run build

          git config user.name "quill"
          git config user.email "quill@vorticalbox.github.io"
          branch="evolve/$(date -u +%Y-%m-%d)-$RUN_ID"
          git checkout -b "$branch"
          git add -A
          git commit -m "$title"
          git push -u origin "$branch"

          {
            echo "Written by the retrospective agent from \`.github/prompts/evolve-agents.md\`,"
            echo "after \`$MERGED_POST\` was merged. It decided, on its own, that this was worth"
            echo "proposing — nothing here is live until this PR is approved."
            echo
            # The agent's own explanation, capped so a chatty run can't fill the PR.
            tail -n "+$body_start" "$summary" 2>/dev/null | head -c 4000 || echo "_no summary captured_"
            echo "$css_note"
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md"

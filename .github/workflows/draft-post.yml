name: Draft a post

# Runs roughly every three days. Note that a "*/3" day-of-month cron is not
# actually every three days — day-of-month resets at each month boundary, so you
# get 3, 6, ... 30, then the 1st. Daily with an early exit is the reliable way to
# get a true interval; a few days' drift is not worth the complexity here.
on:
  schedule:
    - cron: '0 9 */3 * *'
  workflow_dispatch:

# Only the default token, scoped to what this job needs. It cannot touch master.
# contents: write — push the draft branch, and read a post file off a PR head.
# pull-requests: write — list open PRs and open the draft. Write includes the
# read that listing needs; there is no separate read grant.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draft-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Pi
        run: npm i -g --ignore-scripts @earendil-works/pi-coding-agent

      # Pi has no built-in "hyper" provider, so it has to be declared. This is
      # the agent-dir location (~/.pi/agent/models.json); the committed file is
      # a template whose apiKey is the $HYPER_API_KEY env var, not the key.
      - name: Register the Hyper provider
        run: |
          mkdir -p ~/.pi/agent
          cp .github/pi/models.json ~/.pi/agent/models.json

      # Open PRs are not in the master checkout. Branch names and PR titles
      # are the run date, so the story is the post file the PR adds.
      # Zero open PRs is a normal result: the brief says nothing is waiting.
      - name: List stories already covered by open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/pi/covered-stories.mjs > "$RUNNER_TEMP/covered-stories.md"

      # HN and every feed, round-robin, with a sitting-out subject held back.
      # A dead feed or a dead HN exits 0 and names itself in the brief; the
      # step fails only if the script itself crashes.
      - name: Mix Hacker News and every feed into one shortlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/pi/shortlist.mjs > "$RUNNER_TEMP/shortlist.md"

      - name: Find, research and write a post
        env:
          HYPER_API_KEY: ${{ secrets.HYPER_API_KEY }}
          # The repository secret is JINA_TOKEN; the scripts read JINA_API_KEY.
          JINA_API_KEY: ${{ secrets.JINA_TOKEN }}
          PI_MODEL: ${{ vars.PI_MODEL || 'deepseek-v4.1-flash' }}
          # Enforced by .pi/extensions/path-guard.ts, not just the prompt: this
          # job may only write/edit under posts/. --approve trusts .pi/ for
          # this run so the project-local extension actually loads.
          PI_PATH_GUARD_ALLOW: posts/
        run: |
          # --mode json streams one event per action, which live-log.mjs prints
          # as it arrives, so the step is readable while it runs rather than
          # blank for ten minutes. pipefail makes Pi's exit code fail the step:
          # without it a crashed agent looks exactly like a quiet run, because
          # both leave no changes for the PR step to find.
          set -o pipefail
          {
            cat .github/prompts/draft-post.md
            echo
            cat "$RUNNER_TEMP/shortlist.md"
            echo
            cat "$RUNNER_TEMP/covered-stories.md"
          } | pi --mode json \
             --model "$PI_MODEL" \
             --provider hyper \
             --no-session \
             --approve \
            | node .github/pi/live-log.mjs "$RUNNER_TEMP/agent-summary.txt"

      - name: Open a pull request if a post was written
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain posts/)" ]; then
            echo "No post written this run — nothing to propose."
            echo "--- agent summary ---"
            cat "$RUNNER_TEMP/agent-summary.txt"
            exit 0
          fi

          # Same check the prompt was given, run again on the draft itself.
          # Exit 2: it repeats a story an open PR already has — a quiet run.
          # Exit 1: open PRs could not be listed or read, so fail rather than
          # open a PR we could not de-duplicate.
          new_posts=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              *' -> '*) path="${path##* -> }" ;;
            esac
            case "$path" in
              *.md) new_posts+=("$path") ;;
            esac
          done < <(git status --porcelain -- posts/ || true)

          if [ "${#new_posts[@]}" -gt 0 ]; then
            overlap_status=0
            node .github/pi/covered-stories.mjs check "${new_posts[@]}" || overlap_status=$?
            if [ "$overlap_status" -eq 2 ]; then
              echo "Draft repeats a story already in an open pull request — not opening another."
              echo "--- agent summary ---"
              cat "$RUNNER_TEMP/agent-summary.txt"
              exit 0
            fi
            if [ "$overlap_status" -ne 0 ]; then
              exit "$overlap_status"
            fi
          fi

          git config user.name "quill"
          git config user.email "quill@vorticalbox.github.io"
          branch="post/$(date -u +%Y-%m-%d)-$RUN_ID"
          git checkout -b "$branch"
          git add posts/
          git commit -m "Draft post $(date -u +%F)"

          # Build here, before the push: a post that does not build should never
          # become a pull request. This is the job's own check, not the agent's
          # claim that it ran one. ci.yml would normally cover a PR, but GitHub
          # holds pull_request runs from GITHUB_TOKEN-created branches at
          # "action_required", so it does not fire on these.
          npm run build

          git push -u origin "$branch"

          {
            echo "Written by the scheduled agent from \`.github/prompts/draft-post.md\`."
            echo
            echo "**Review before merging — merging to \`master\` publishes immediately.**"
            echo
            echo "### Why this story"
            echo
            # The agent's final message, capped so a chatty run can't fill the PR.
            head -c 4000 "$RUNNER_TEMP/agent-summary.txt" 2>/dev/null || echo "_no summary captured_"
            echo
            echo "### Checks"
            echo
            echo "The draft job ran \`npm run build\` on this branch before opening the PR."
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create \
            --base master \
            --head "$branch" \
            --title "Draft post $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
